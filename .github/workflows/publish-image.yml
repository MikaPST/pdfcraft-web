name: Build and publish PdfCraft Web

on:
  schedule:
    # Weekly rebuild from upstream PdfCraft main (UTC).
    - cron: "47 4 * * 1"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official upstream release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "README.md"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: write
  packages: write

concurrency:
  group: pdfcraft-web-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Resolve official upstream release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const args = { owner: 'storytold', repo: 'pdfcraft' };
            const result = requested
              ? await github.rest.repos.getReleaseByTag({ ...args, tag: requested })
              : await github.rest.repos.getLatestRelease(args);
            const release = result.data;
            if (!release.tag_name) throw new Error('No upstream release tag found');
            core.setOutput('tag', release.tag_name);
            core.setOutput('url', release.html_url);
            core.setOutput('body', release.body || '');
            core.setOutput('prerelease', String(release.prerelease));
            core.setOutput('published_at', release.published_at || '');
            core.setOutput('name', release.name || `pdfcraft ${release.tag_name}`);

      - name: Check local release
        id: release-check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.TAG });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const forced = process.env.FORCE_REBUILD === 'true' || context.eventName === 'push';
            core.setOutput('skip', String(exists && !forced));

      - name: Check out PdfCraft source
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/pdfcraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: upstream
          fetch-depth: 1

      - name: Check out shared font assets
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts
          fetch-depth: 1

      - name: Record source revisions
        if: steps.release-check.outputs.skip != 'true'
        id: source
        shell: bash
        run: |
          echo "pdfcraft_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pdfcraft_short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "craft_fonts_sha=$(git -C craft-fonts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record upstream release commit for image tags
        if: steps.release-check.outputs.skip != 'true'
        id: release-source
        shell: bash
        run: |
          echo "short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust and WebAssembly target
        if: steps.release-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        if: steps.release-check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"

      - name: Install Trunk
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: cargo install trunk --locked

      - name: Install matching wasm-bindgen CLI
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          WASM_BINDGEN_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("upstream/Cargo.lock").read_text())
          versions = {
              pkg["version"]
              for pkg in lock["package"]
              if pkg["name"] == "wasm-bindgen"
          }
          if not versions:
              raise SystemExit("No wasm-bindgen package found in upstream/Cargo.lock")

          def version_key(version):
              return tuple(int(part) for part in version.split("-")[0].split("."))

          print(max(versions, key=version_key))
          PY
          )"
          echo "Installing wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Build PdfCraft WebAssembly app
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          export CRAFT_FONTS_DIR="${GITHUB_WORKSPACE}/craft-fonts"
          cd upstream/apps/pdfcraft-web
          trunk build --release

      - name: Prepare Docker build context and NGINX configuration
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          WEB_DIST="upstream/dist/web"
          test -f "${WEB_DIST}/index.html"
          test -n "$(find "${WEB_DIST}" -type f -name '*.wasm' -print -quit)"
          test -n "$(find "${WEB_DIST}" -maxdepth 1 -type f -name '*.js' -print -quit)"

          # Ensure the generated HTML keeps relative URLs, as required by upstream.
          if grep -Eq '(src|href)="/[^/]' "${WEB_DIST}/index.html"; then
            echo "::error::The generated site contains root-absolute URLs and may not work under a URL prefix."
            exit 1
          fi

          mkdir -p docker-build/dist
          cp -a "${WEB_DIST}/." docker-build/dist/

          cat > docker-build/nginx.conf <<'NGINX'
          server {
              listen 8080;
              listen [::]:8080;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              # PdfCraft's site is static and may also be hosted under a URL prefix.
              location / {
                  try_files $uri $uri/ =404;
              }

              location = /index.html {
                  default_type text/html;
                  add_header Cache-Control "no-cache";
              }

              location ~* \.wasm$ {
                  default_type application/wasm;
                  add_header Cache-Control "public, max-age=31536000, immutable";
              }

              location ~* \.js$ {
                  default_type text/javascript;
                  add_header Cache-Control "public, max-age=31536000, immutable";
              }

              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              gzip_types application/wasm text/javascript;
          }
          NGINX

          cat > docker-build/Dockerfile <<'DOCKERFILE'
          FROM nginx:alpine

          ARG PDFCRAFT_COMMIT
          ARG CRAFT_FONTS_COMMIT

          LABEL org.opencontainers.image.title="PdfCraft Web"
          LABEL org.opencontainers.image.description="Self-hosted browser build of PdfCraft"
          LABEL org.opencontainers.image.source="https://github.com/storytold/pdfcraft"
          LABEL org.opencontainers.image.revision="${PDFCRAFT_COMMIT}"
          LABEL io.mikapst.pdfcraft.craft-fonts-revision="${CRAFT_FONTS_COMMIT}"

          RUN rm -f /etc/nginx/conf.d/default.conf

          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY dist/ /usr/share/nginx/html/

          EXPOSE 8080
          DOCKERFILE

          test -f docker-build/Dockerfile
          test -f docker-build/nginx.conf
          test -f docker-build/dist/index.html
          echo "Generated Docker build context:"
          find docker-build -maxdepth 2 -type f | sort | head -60

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: steps.release-check.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mikapst/pdfcraft-web
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream-release.outputs.tag }}
            type=raw,value=upstream-${{ steps.source.outputs.pdfcraft_short }}

      - name: Build and publish multi-platform image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/docker-build
          file: ${{ github.workspace }}/docker-build/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PDFCRAFT_COMMIT=${{ steps.source.outputs.pdfcraft_sha }}
            CRAFT_FONTS_COMMIT=${{ steps.source.outputs.craft_fonts_sha }}

      - name: Create or update versioned GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.upstream-release.outputs.tag }}
          RELEASE_NAME: ${{ steps.upstream-release.outputs.name }}
          RELEASE_URL: ${{ steps.upstream-release.outputs.url }}
          RELEASE_NOTES: ${{ steps.upstream-release.outputs.body }}
          RELEASE_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          RELEASE_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          RELEASE_SOURCE_SHA: ${{ steps.release-source.outputs.short }}
          RELEASE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const image = 'ghcr.io/mikapst/pdfcraft-web';
            const body = [
              `Community-maintained Docker packaging for **${process.env.RELEASE_NAME}**.`,
              '',
              '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.RELEASE_SOURCE_SHA}\``,
              '',
              'Platforms: `linux/amd64`, `linux/arm64`.',
              '',
              `Official upstream release: ${process.env.RELEASE_URL}`,
              `Published upstream: ${process.env.RELEASE_PUBLISHED_AT || 'not specified'}`,
              '',
              `Upstream source commit: \`${process.env.RELEASE_SOURCE_SHA}\``,
              `Docker manifest digest: \`${process.env.RELEASE_DIGEST || 'not reported'}\``,
              '',
              '## Upstream release notes',
              process.env.RELEASE_NOTES || 'No release notes provided upstream.',
              '',
              'This is an independent Docker packaging release, not an official upstream distribution.'
            ].join('\n');
            let existing;
            try {
              existing = (await github.rest.repos.getReleaseByTag({ ...context.repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (existing) {
              await github.rest.repos.updateRelease({
                ...context.repo, release_id: existing.id, name: 'PdfCraft Web ' + tag,
                body, draft: false, prerelease: process.env.RELEASE_PRERELEASE === 'true'
              });
            } else {
              await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, target_commitish: context.sha,
                name: 'PdfCraft Web ' + tag, body, draft: false, prerelease: process.env.RELEASE_PRERELEASE === 'true'
              });
            }
