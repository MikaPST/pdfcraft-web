name: Build and publish PdfCraft Web

on:
  schedule:
    # Weekly rebuild from upstream PdfCraft main (UTC).
    - cron: "47 4 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - "README.md"
      - ".github/workflows/publish-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: pdfcraft-web-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v4

      - name: Check out PdfCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/pdfcraft
          ref: main
          path: upstream
          fetch-depth: 1

      - name: Check out shared font assets
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: main
          path: craft-fonts
          fetch-depth: 1

      - name: Record source revisions
        id: source
        shell: bash
        run: |
          echo "pdfcraft_sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pdfcraft_short=$(git -C upstream rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "craft_fonts_sha=$(git -C craft-fonts rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "upstream -> upstream/target"

      - name: Install Trunk
        shell: bash
        run: cargo install trunk --locked

      - name: Install matching wasm-bindgen CLI
        shell: bash
        run: |
          WASM_BINDGEN_VERSION="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("upstream/Cargo.lock").read_text())
          versions = {
              pkg["version"]
              for pkg in lock["package"]
              if pkg["name"] == "wasm-bindgen"
          }
          if not versions:
              raise SystemExit("No wasm-bindgen package found in upstream/Cargo.lock")

          def version_key(version):
              return tuple(int(part) for part in version.split("-")[0].split("."))

          print(max(versions, key=version_key))
          PY
          )"
          echo "Installing wasm-bindgen-cli ${WASM_BINDGEN_VERSION}"
          cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked

      - name: Build PdfCraft WebAssembly app
        shell: bash
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          export CRAFT_FONTS_DIR="${GITHUB_WORKSPACE}/craft-fonts"
          cd upstream/apps/pdfcraft-web
          trunk build --release

      - name: Prepare Docker build context and NGINX configuration
        shell: bash
        run: |
          set -euo pipefail

          WEB_DIST="upstream/dist/web"
          test -f "${WEB_DIST}/index.html"
          test -n "$(find "${WEB_DIST}" -type f -name '*.wasm' -print -quit)"
          test -n "$(find "${WEB_DIST}" -maxdepth 1 -type f -name '*.js' -print -quit)"

          # Ensure the generated HTML keeps relative URLs, as required by upstream.
          if grep -Eq '(src|href)="/[^/]' "${WEB_DIST}/index.html"; then
            echo "::error::The generated site contains root-absolute URLs and may not work under a URL prefix."
            exit 1
          fi

          mkdir -p docker-build/dist
          cp -a "${WEB_DIST}/." docker-build/dist/

          cat > docker-build/nginx.conf <<'NGINX'
          server {
              listen 8080;
              listen [::]:8080;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              # PdfCraft's site is static and may also be hosted under a URL prefix.
              location / {
                  try_files $uri $uri/ =404;
              }

              location = /index.html {
                  default_type text/html;
                  add_header Cache-Control "no-cache";
              }

              location ~* \.wasm$ {
                  default_type application/wasm;
                  add_header Cache-Control "public, max-age=31536000, immutable";
              }

              location ~* \.js$ {
                  default_type text/javascript;
                  add_header Cache-Control "public, max-age=31536000, immutable";
              }

              gzip on;
              gzip_vary on;
              gzip_min_length 1024;
              gzip_types application/wasm text/javascript text/html;
          }
          NGINX

          cat > docker-build/Dockerfile <<'DOCKERFILE'
          FROM nginx:alpine

          ARG PDFCRAFT_COMMIT
          ARG CRAFT_FONTS_COMMIT

          LABEL org.opencontainers.image.title="PdfCraft Web"
          LABEL org.opencontainers.image.description="Self-hosted browser build of PdfCraft"
          LABEL org.opencontainers.image.source="https://github.com/storytold/pdfcraft"
          LABEL org.opencontainers.image.revision="${PDFCRAFT_COMMIT}"
          LABEL io.mikapst.pdfcraft.craft-fonts-revision="${CRAFT_FONTS_COMMIT}"

          RUN rm -f /etc/nginx/conf.d/default.conf

          COPY nginx.conf /etc/nginx/conf.d/default.conf
          COPY dist/ /usr/share/nginx/html/

          EXPOSE 8080
          DOCKERFILE

          test -f docker-build/Dockerfile
          test -f docker-build/nginx.conf
          test -f docker-build/dist/index.html
          echo "Generated Docker build context:"
          find docker-build -maxdepth 2 -type f | sort | head -60

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mikapst/pdfcraft-web
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ steps.source.outputs.pdfcraft_short }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/docker-build
          file: ${{ github.workspace }}/docker-build/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PDFCRAFT_COMMIT=${{ steps.source.outputs.pdfcraft_sha }}
            CRAFT_FONTS_COMMIT=${{ steps.source.outputs.craft_fonts_sha }}
