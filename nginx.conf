# PdfCraft Web — static application, OCR assets and non-root NGINX.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # Required when NGINX runs as an unprivileged user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm text/javascript application/javascript application/json text/css;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Upstream recommends opener isolation but does not require COEP or
        # SharedArrayBuffer cross-origin isolation.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Revalidate the entry page after an image update.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # The OCR models have stable filenames and MUST be revalidated. This
        # also protects against an obsolete model being paired with a new app.
        location ^~ /models/ {
            add_header Cache-Control "no-cache" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Trunk emits content-hashed application and OCR worker assets.
        location ~* \.(wasm|js)$ {
            types { application/wasm wasm; text/javascript js; }
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        location / { try_files $uri $uri/ =404; }
    }
}
